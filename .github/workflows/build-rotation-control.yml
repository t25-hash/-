name: Build Rotation Control debug APK

on:
  push:
    branches: [ main ]
    paths:
      - 'rotation-control/**'
      - '.github/workflows/build-rotation-control.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Use stable debug signing key
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.base64 > ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: rotation-control
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotation-control-debug
          path: rotation-control/app/build/outputs/apk/debug/app-debug.apk
