name: Build Tag Ranking Widget debug APK

on:
  push:
    branches: [ main ]
    paths:
      - 'tag-ranking-widget/**'
      - '.github/workflows/build-tag-ranking-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: tag-ranking-widget
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag-ranking-widget-debug
          path: tag-ranking-widget/app/build/outputs/apk/debug/app-debug.apk
